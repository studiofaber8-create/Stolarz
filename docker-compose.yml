services:
  camofox:
    image: ${CAMOFOX_IMAGE:-ghcr.io/redf0x1/camofox-browser:2.4.6}
    restart: unless-stopped
    ports:
      - "127.0.0.1:9377:9377"
      - "127.0.0.1:6080:6080"
    environment:
      CAMOFOX_HOST: 0.0.0.0
      CAMOFOX_PORT: 9377
      CAMOFOX_AUTH_MODE: required
      CAMOFOX_API_KEY: ${CAMOFOX_API_KEY:?Set CAMOFOX_API_KEY}
      CAMOFOX_HEADLESS: "true"
      CAMOFOX_MAX_SESSIONS: ${CAMOFOX_MAX_SESSIONS:-20}
      CAMOFOX_MAX_TABS: ${CAMOFOX_MAX_TABS:-5}
      CAMOFOX_PROFILES_DIR: /home/node/.camofox/profiles
      CAMOFOX_VNC_HOST: localhost
      CAMOFOX_VNC_TIMEOUT_MS: ${CAMOFOX_VNC_TIMEOUT_MS:-600000}
    volumes:
      - camofox-data:/home/node/.camofox
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:9377/health',{headers:{authorization:'Bearer '+process.env.CAMOFOX_API_KEY}}).then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5

  agent:
    build: .
    restart: unless-stopped
    depends_on:
      camofox:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      CAMOFOX_URL: http://camofox:9377
      CAMOFOX_API_KEY: ${CAMOFOX_API_KEY:?Set CAMOFOX_API_KEY}
      CAMOFOX_REQUEST_TIMEOUT_MS: ${CAMOFOX_REQUEST_TIMEOUT_MS:-30000}
      AGENT_DATA_DIR: /app/data
      AGENT_PROFILE_PREFIX: ${AGENT_PROFILE_PREFIX:-stolarz-fb}
      AGENT_WORKER_ENABLED: ${AGENT_WORKER_ENABLED:-true}
      AGENT_SCHEDULER_INTERVAL_MS: ${AGENT_SCHEDULER_INTERVAL_MS:-30000}
      AGENT_WORKER_POLL_MS: ${AGENT_WORKER_POLL_MS:-1000}
      AGENT_JOB_LEASE_MS: ${AGENT_JOB_LEASE_MS:-180000}
      AGENT_REVIEW_THRESHOLD: ${AGENT_REVIEW_THRESHOLD:-0.8}
      AGENT_BUSINESS_DESCRIPTION: ${AGENT_BUSINESS_DESCRIPTION:-Wykonujemy meble i zabudowy na wymiar.}
      FACEBOOK_HOME_URL: https://www.facebook.com/
      PANEL_HOST: 0.0.0.0
      PANEL_PORT: 3000
      PANEL_API_TOKEN: ${PANEL_API_TOKEN:?Set PANEL_API_TOKEN}
      LLM_API_URL: ${LLM_API_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-claude-opus-4-8}
      LLM_API_FORMAT: ${LLM_API_FORMAT:-anthropic}
      LLM_ANTHROPIC_VERSION: ${LLM_ANTHROPIC_VERSION:-2023-06-01}
      LLM_REQUEST_TIMEOUT_MS: ${LLM_REQUEST_TIMEOUT_MS:-120000}
    volumes:
      - agent-data:/app/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3000/api/health',{headers:{authorization:'Bearer '+process.env.PANEL_API_TOKEN}}).then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

volumes:
  camofox-data:
  agent-data:
